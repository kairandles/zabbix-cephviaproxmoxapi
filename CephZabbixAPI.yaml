    # ── Storage capacity ──────────────────────────────────────────────────────
    - uuid: 2e28ec66950e41d29ba799f5268ee027
      name: Cluster Storage Total
      type: DEPENDENT
      key: ceph.cluster.storage.total
      delay: '0'
      history: 90d
      value_type: FLOAT
      units: B
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.pgmap.bytes_total
        error_handler: CUSTOM_VALUE
