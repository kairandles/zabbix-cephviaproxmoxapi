    - uuid: eadcccce835d4422b00ecd66199e0dd9
      name: PGs Active+Clean
      type: DEPENDENT
      key: ceph.cluster.pgs.active_clean
      delay: '0'
      history: 90d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var states = (d.pgmap || {}).pgs_by_state || [];
          var count = 0;
          for (var i = 0; i < states.length; i++) {
              if (states[i].state_name === 'active+clean') count += states[i].count;
          }
          return count;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 2m
      master_item:
        key: proxmox.ceph.raw.status
      tags:
      - tag: component
        value: cluster

    - uuid: c4010741e29b4d6d9c2966b81fb0184c
      name: PGs Degraded
      type: DEPENDENT
      key: ceph.cluster.pgs.degraded
      delay: '0'
      history: 90d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var states = (d.pgmap || {}).pgs_by_state || [];
          var count = 0;
          for (var i = 0; i < states.length; i++) {
              if (states[i].state_name.indexOf('degraded') !== -1) count += states[i].count;
          }
          return count;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 2m
      master_item:
        key: proxmox.ceph.raw.status
      tags:
      - tag: component
        value: cluster
      triggers:
      - uuid: 2040b0c2f98848c4abc5c622c549f05e
        expression: last(/Proxmox Ceph API/ceph.cluster.pgs.degraded)>0
        name: 'Ceph has {ITEM.LASTVALUE} degraded PG(s)'
        priority: AVERAGE
        description: One or more placement groups are degraded, meaning not all replicas are available. The
          cluster is self-healing but performance may be reduced during recovery. Monitor the count — if it
          grows rather than shrinks, or if recovery stalls, check OSD status and available space. A degraded
          cluster is at increased risk from a second OSD failure.

