    - uuid: 2f4048bdba3b476ea37c75f901dfdd5f
      name: Cluster Storage Used
      type: DEPENDENT
      key: ceph.cluster.storage.used
      delay: '0'
      history: 90d
      value_type: FLOAT
      units: B
      preprocessing:
