    - uuid: 30cdf6a896064f3db99d34238522ed3a
      name: PGs Stale
      type: DEPENDENT
      key: ceph.cluster.pgs.stale
      delay: '0'
      history: 90d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var states = (d.pgmap || {}).pgs_by_state || [];
          var count = 0;
          for (var i = 0; i < states.length; i++) {
              if (states[i].state_name.indexOf('stale') !== -1) count += states[i].count;
          }
          return count;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 2m
      master_item:
        key: proxmox.ceph.raw.status
      tags:
      - tag: component
        value: cluster
      triggers:
      - uuid: 98af742c0a4846f6a88c39a2018afd83
        expression: last(/Proxmox Ceph API/ceph.cluster.pgs.stale)>0
        name: 'Ceph has {ITEM.LASTVALUE} stale PG(s)'
        priority: HIGH
        description: Stale PGs have not received an update from their primary OSD. This usually means the OSD
          responsible for those PGs is down or unreachable, and data in those PGs may be unavailable to clients.
          Check OSD status and MON quorum. If OSDs look healthy, the MON may need to be restarted on the
          affected node.

