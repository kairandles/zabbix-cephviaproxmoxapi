zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 47ff398bf59b476a8b8234ba73036ef3
    name: Templates
  templates:
  - uuid: 54a44b23c62e4110a3504a78d7fffd80
    template: Proxmox Ceph API
    name: Proxmox Ceph API
    description: |
      Zabbix Ceph monitoring template via the Proxmox REST API.

      Fetches cluster health, OSD, MON, MGR, and pool data from a single Proxmox node
      (or load balancer VIP). Set {$PVE.URL.HOST} to your Proxmox host or LB address.

      Auth uses a Proxmox API token — create a read-only user (e.g. zabbix@pve), generate
      a token, and set {$PVE.TOKEN.ID} and {$PVE.TOKEN.SECRET} accordingly.
    groups:
    - name: Templates
    items:
    - uuid: 2defcf9d3a9647c2af502d3a2d52924b
      name: 'Ceph Raw: Cluster Status'
      type: HTTP_AGENT
      key: proxmox.ceph.raw.status
      delay: 1m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://{$PVE.URL.HOST}:8006/api2/json/cluster/ceph/status
      timeout: 15s
      headers:
      - name: Authorization
        value: 'PVEAPIToken={$PVE.TOKEN.ID}={$PVE.TOKEN.SECRET}'
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      tags:
      - tag: component
        value: raw

    - uuid: 6ac915bb4e27410da99b53cee1158826
      name: 'Ceph Raw: OSDs'
      type: HTTP_AGENT
      key: proxmox.ceph.raw.osd
      delay: 1m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://{$PVE.URL.HOST}:8006/api2/json/nodes/{$PVE.NODE}/ceph/osd
      timeout: 15s
      headers:
      - name: Authorization
        value: 'PVEAPIToken={$PVE.TOKEN.ID}={$PVE.TOKEN.SECRET}'
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      tags:
      - tag: component
        value: raw

    - uuid: cfc00e0ab01345d78e1818f5bf66eaad
      name: 'Ceph Raw: MONs'
      type: HTTP_AGENT
      key: proxmox.ceph.raw.mon
      delay: 1m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://{$PVE.URL.HOST}:8006/api2/json/nodes/{$PVE.NODE}/ceph/mon
      timeout: 15s
      headers:
      - name: Authorization
        value: 'PVEAPIToken={$PVE.TOKEN.ID}={$PVE.TOKEN.SECRET}'
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      tags:
      - tag: component
        value: raw

    - uuid: 38cbe2767e204a3ea0260234b2323563
      name: 'Ceph Raw: MGRs'
      type: HTTP_AGENT
      key: proxmox.ceph.raw.mgr
      delay: 1m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://{$PVE.URL.HOST}:8006/api2/json/nodes/{$PVE.NODE}/ceph/mgr
      timeout: 15s
      headers:
      - name: Authorization
        value: 'PVEAPIToken={$PVE.TOKEN.ID}={$PVE.TOKEN.SECRET}'
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      tags:
      - tag: component
        value: raw

    - uuid: 5e773f8e810d4279b50c26b3e933348e
      name: 'Ceph Raw: Pools'
      type: HTTP_AGENT
      key: proxmox.ceph.raw.pool
      delay: 1m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://{$PVE.URL.HOST}:8006/api2/json/nodes/{$PVE.NODE}/ceph/pool
      timeout: 15s
      headers:
      - name: Authorization
        value: 'PVEAPIToken={$PVE.TOKEN.ID}={$PVE.TOKEN.SECRET}'
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      tags:
      - tag: component
        value: raw

    # ── Cluster health ────────────────────────────────────────────────────────
    - uuid: b489bab4957f4e518556c8a8b4223861
      name: Cluster Health Status
      type: DEPENDENT
      key: ceph.cluster.health
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.health.status
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1m
      master_item:
        key: proxmox.ceph.raw.status
      tags:
      - tag: component
        value: cluster
      triggers:
      - uuid: 3200ccba67cb465dbbc5fbdc55aa33c7
        expression: find(/Proxmox Ceph API/ceph.cluster.health,#1,"regexp","HEALTH_ERR")=1
        name: 'Ceph cluster health is HEALTH_ERR'
        priority: DISASTER
        description: The Ceph cluster is reporting HEALTH_ERR. This indicates a serious condition that may affect
          data integrity or availability. Check the Proxmox Ceph dashboard immediately for active health checks.
          Common causes include a failed OSD, insufficient replicas, or a clock skew between MONs. Do not ignore
          HEALTH_ERR — data loss is possible if the condition is not resolved promptly.
      - uuid: c5fd3386d7414f05be8cef872de6a7be
        expression: find(/Proxmox Ceph API/ceph.cluster.health,#1,"regexp","HEALTH_WARN")=1
        name: 'Ceph cluster health is HEALTH_WARN'
        priority: AVERAGE
        description: The Ceph cluster is reporting HEALTH_WARN. The cluster is operational but has a condition
          that requires attention. Check the Proxmox Ceph dashboard for the specific health check that is firing.
          Common causes include a slow OSD, a clock skew, a nearly-full OSD, or a PG imbalance. Resolve before
          the condition escalates to HEALTH_ERR.

    - uuid: 1ff7e2d825e1435aa84a0557259dc940
      name: Cluster Health Checks
      type: DEPENDENT
      key: ceph.cluster.health.checks
      delay: '0'
      history: 7d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var checks = (d.health || {}).checks || {};
          return JSON.stringify(checks);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: proxmox.ceph.raw.status
      tags:
      - tag: component
        value: cluster

    # ── OSD map ───────────────────────────────────────────────────────────────
    - uuid: 6341b3af9d044c62a354c654a2f9f58e
      name: OSDs Total
      type: DEPENDENT
      key: ceph.cluster.osds.total
      delay: '0'
      history: 90d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.osdmap.num_osds
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: proxmox.ceph.raw.status
      tags:
      - tag: component
        value: cluster

    - uuid: 656b7951da794c6282cbdc89c251576d
      name: OSDs Up
      type: DEPENDENT
      key: ceph.cluster.osds.up
      delay: '0'
      history: 90d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.osdmap.num_up_osds
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 2m
      master_item:
        key: proxmox.ceph.raw.status
      tags:
      - tag: component
        value: cluster
      triggers:
      - uuid: a878899429574e0e9dd38b344eaba65a
        expression: last(/Proxmox Ceph API/ceph.cluster.osds.up)<last(/Proxmox Ceph API/ceph.cluster.osds.total)
          and last(/Proxmox Ceph API/ceph.cluster.osds.total)>0
        name: 'One or more Ceph OSDs are down ({ITEM.LASTVALUE} up of {?last(/Proxmox Ceph API/ceph.cluster.osds.total)} total)'
        priority: HIGH
        description: At least one OSD is not in an up state. The cluster will continue operating with reduced
          redundancy but PGs assigned to the failed OSD(s) will be degraded. Check the OSD discovery triggers
          to identify the specific disk. If the OSD does not recover automatically within a few minutes, inspect
          the disk and the Proxmox node it resides on.

    - uuid: 139c2e7c968d4106b2e541e789e17233
      name: OSDs In
      type: DEPENDENT
      key: ceph.cluster.osds.in
      delay: '0'
      history: 90d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.osdmap.num_in_osds
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 2m
      master_item:
        key: proxmox.ceph.raw.status
      tags:
      - tag: component
        value: cluster

    # ── PG map ────────────────────────────────────────────────────────────────
    - uuid: b5bf705acfb04ab0a80b321e02fa87f7
      name: PGs Total
      type: DEPENDENT
      key: ceph.cluster.pgs.total
